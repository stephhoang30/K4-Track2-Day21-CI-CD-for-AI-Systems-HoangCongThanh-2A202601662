name: Income Model CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'params.yaml'
  workflow_dispatch:

env:
  F1_THRESHOLD: "0.65"

jobs:

  # ---------------------------------------------------------------------------
  # JOB 1 - UNIT TEST
  # Chay unit tests tren du lieu ao (khong can ket noi cloud storage).
  # Neu co bat ky test nao that bai, pipeline dung lai o day va khong tien hanh
  # huan luyen hay trien khai.
  # ---------------------------------------------------------------------------
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/ -v


  # ---------------------------------------------------------------------------
  # JOB 2 - TRAIN
  # Xac thuc S3, pull du lieu bang DVC, huan luyen mo hinh, upload artifact.
  # Model moi duoc dua vao artifacts/candidate/ chu KHONG ghi de
  # artifacts/current/. Chi khi qua het cac cong o Job 3 thi Job 4 moi promote
  # candidate len current. Nho vay mot model kem khong bao gio nam o vi tri ma
  # VM se tai khi khoi dong.
  # Chi chay khi Job 1 (Unit Test) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  train:
    name: Train
    needs: unit-test
    runs-on: ubuntu-latest
    outputs:
      f1: ${{ steps.read_report.outputs.f1 }}
      accuracy: ${{ steps.read_report.outputs.accuracy }}
      prev_f1: ${{ steps.prev_report.outputs.prev_f1 }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Cloud Storage
        env:
          STORAGE_CREDENTIALS: ${{ secrets.STORAGE_CREDENTIALS }}
        run: |
          python - <<'PYEOF'
          import json, os

          creds = json.loads(os.environ["STORAGE_CREDENTIALS"])
          key_id = creds["aws_access_key_id"]
          secret = creds["aws_secret_access_key"]
          region = creds.get("region", "us-east-1")

          # Che gia tri trong log phong khi buoc sau lo in ra
          print(f"::add-mask::{key_id}")
          print(f"::add-mask::{secret}")

          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"AWS_ACCESS_KEY_ID={key_id}\n")
              f.write(f"AWS_SECRET_ACCESS_KEY={secret}\n")
              f.write(f"AWS_DEFAULT_REGION={region}\n")

          print(f"Da cau hinh credentials AWS, region={region}")
          PYEOF

      - name: Read report of currently released model
        id: prev_report
        env:
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
        run: |
          if aws s3 cp "s3://$ARTIFACT_BUCKET/artifacts/current/report.json" /tmp/prev.json 2>/dev/null; then
            PREV=$(python -c "import json; print(json.load(open('/tmp/prev.json'))['f1_score'])")
            echo "Model dang phuc vu co f1_score = $PREV"
          else
            PREV=""
            echo "Chua co report tren S3 - day la lan chay dau tien."
          fi
          echo "prev_f1=$PREV" >> $GITHUB_OUTPUT

      - name: Pull data with DVC
        # Chi keo train_batch1 va holdout - train_batch2 khong can cho viec huan luyen
        run: dvc pull data/train_batch1.csv.dvc data/holdout.csv.dvc

      - name: Train model
        run: python src/train.py

      - name: Read report
        id: read_report
        run: |
          python - <<'PYEOF'
          import json, os

          r = json.load(open("outputs/report.json"))
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"f1={r['f1_score']}\n")
              f.write(f"accuracy={r['accuracy']}\n")

          print(f"f1_score = {r['f1_score']:.4f} | accuracy = {r['accuracy']:.4f}")
          print(f"ty le lop duong = {r['positive_rate']:.2%}")
          print(f"nguong quyet dinh tot nhat = {r['best_threshold']:.2f} "
                f"-> f1 {r['f1_at_best_threshold']:.4f}")
          PYEOF

      - name: Upload candidate model to Cloud Storage
        env:
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
        run: |
          python - <<'PYEOF'
          import os
          import boto3

          bucket = os.environ["ARTIFACT_BUCKET"]
          key = "artifacts/candidate/model.joblib"

          boto3.client("s3").upload_file("models/model.joblib", bucket, key)
          print(f"Da upload -> s3://{bucket}/{key}")
          print("Chua ghi de artifacts/current - cho qua quality gate da.")
          PYEOF

      - name: Save report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: |
            outputs/report.json
            outputs/detail.txt


  # ---------------------------------------------------------------------------
  # JOB 3 - QUALITY GATE
  # Hai cong chat luong:
  #   1. Nguong tuyet doi: f1_score >= F1_THRESHOLD.
  #   2. Chong tut hang: f1_score moi khong duoc thap hon model dang phuc vu.
  #
  # Luu y: nguong o day dat tren f1_score chu KHONG phai accuracy. Bo du lieu
  # Adult co ty le lop 75/25, nen mot mo hinh doan bua "thu nhap thap" cho moi
  # mau da dat accuracy 0.75 ma hoan toan vo dung.
  # Chi chay khi Job 2 (Train) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  quality-gate:
    name: Quality Gate
    needs: train
    runs-on: ubuntu-latest
    steps:

      - name: Check quality gate
        env:
          F1: ${{ needs.train.outputs.f1 }}
          ACCURACY: ${{ needs.train.outputs.accuracy }}
          PREV_F1: ${{ needs.train.outputs.prev_f1 }}
        run: |
          python - <<'PYEOF'
          import os

          # Output cua GitHub Actions luon la chuoi - bat buoc phai float()
          f1 = float(os.environ["F1"])
          acc = float(os.environ["ACCURACY"])
          threshold = float(os.environ["F1_THRESHOLD"])
          prev_raw = os.environ.get("PREV_F1", "").strip()

          print(f"f1_score  = {f1:.4f}")
          print(f"accuracy  = {acc:.4f}")
          print(f"threshold = {threshold:.2f} (dat tren f1_score, khong phai accuracy)")
          print()

          # Cong 1 - nguong chat luong tuyet doi
          if f1 < threshold:
              raise SystemExit(
                  f"FAILED: f1_score {f1:.4f} < {threshold:.2f}. Huy trien khai. "
                  f"(accuracy {acc:.4f} van cao, day chinh la ly do gate dat tren F1)"
              )
          print(f"PASSED cong 1 - dat nguong: {f1:.4f} >= {threshold:.2f}")

          # Cong 2 - chong tut hang so voi model dang phuc vu
          if prev_raw:
              prev = float(prev_raw)
              print(f"Model dang phuc vu: {prev:.4f} -> model moi: {f1:.4f} "
                    f"({f1 - prev:+.4f})")
              if f1 < prev:
                  raise SystemExit(
                      f"FAILED: model moi kem hon model dang phuc vu "
                      f"({f1:.4f} < {prev:.4f}). Giu nguyen ban cu, huy trien khai."
                  )
              print("PASSED cong 2 - khong tut hang so voi ban cu.")
          else:
              print("Chua co model nao dang phuc vu - bo qua cong 2.")

          print()
          print("Ca hai cong deu qua, tien hanh trien khai.")
          PYEOF


  # ---------------------------------------------------------------------------
  # JOB 4 - RELEASE
  # Promote candidate len current roi restart service tren VM.
  # Chi chay khi Job 3 (Quality Gate) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  release:
    name: Release
    needs: [train, quality-gate]
    runs-on: ubuntu-latest
    steps:

      - name: Authenticate to Cloud Storage
        env:
          STORAGE_CREDENTIALS: ${{ secrets.STORAGE_CREDENTIALS }}
        run: |
          python3 - <<'PYEOF'
          import json, os

          creds = json.loads(os.environ["STORAGE_CREDENTIALS"])
          key_id = creds["aws_access_key_id"]
          secret = creds["aws_secret_access_key"]
          region = creds.get("region", "us-east-1")

          print(f"::add-mask::{key_id}")
          print(f"::add-mask::{secret}")

          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"AWS_ACCESS_KEY_ID={key_id}\n")
              f.write(f"AWS_SECRET_ACCESS_KEY={secret}\n")
              f.write(f"AWS_DEFAULT_REGION={region}\n")
          PYEOF

      - name: Promote candidate to current
        env:
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
          F1: ${{ needs.train.outputs.f1 }}
          ACCURACY: ${{ needs.train.outputs.accuracy }}
        run: |
          # Dung s3api copy-object chu khong dung "aws s3 cp": lenh cp con goi
          # GetObjectTagging/PutObjectTagging, ma IAM user CI co tinh khong duoc
          # cap hai quyen do. copy-object chi can GetObject + PutObject.
          aws s3api copy-object \
            --bucket "$ARTIFACT_BUCKET" \
            --key artifacts/current/model.joblib \
            --copy-source "$ARTIFACT_BUCKET/artifacts/candidate/model.joblib" \
            --query 'CopyObjectResult.LastModified' --output text

          python3 - <<'PYEOF'
          import json, os
          json.dump(
              {"f1_score": float(os.environ["F1"]),
               "accuracy": float(os.environ["ACCURACY"])},
              open("/tmp/current.json", "w"),
          )
          PYEOF

          aws s3 cp /tmp/current.json "s3://$ARTIFACT_BUCKET/artifacts/current/report.json"
          echo "Da promote candidate -> current, va ghi lai report de lan sau doi chieu."

      - name: SSH deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            sudo systemctl restart income-api

            # Server phai tai model tu S3 khi khoi dong nen can cho, khong
            # dung sleep co dinh: thu lai toi da 10 lan, moi lan cach 3 giay.
            for i in $(seq 1 10); do
              sleep 3
              if curl -sf http://localhost:8080/healthz; then
                echo ""
                echo "Health check passed sau $((i * 3)) giay."
                exit 0
              fi
              echo "Server chua san sang, thu lai ($i/10)..."
            done

            echo "Health check FAILED - log 30 dong cuoi cua service:"
            sudo journalctl -u income-api -n 30 --no-pager
            exit 1
